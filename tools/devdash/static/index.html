<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devdash</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17c4-8 7-8 9-4s5 4 9-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    <div>
      <div class="brand-name">devdash</div>
      <div class="brand-sub">Stranded Together tests and research</div>
    </div>
  </div>
  <div class="counters" id="counters"></div>
  <div class="conn" id="conn" title="connection to the devdash server"><span class="dot"></span><span id="conn-text">connecting</span></div>
</header>

<div class="alerts" id="alerts"></div>

<main class="grid">
  <section class="col">
    <div class="panel">
      <div class="panel-head"><h2>Live tests</h2><span class="hint" id="live-hint"></span></div>
      <div id="live" class="cards"></div>
    </div>
    <div class="panel" id="batches-panel">
      <div class="panel-head"><h2>Batches</h2><span class="hint">tools/testenv/Run-Batch.ps1</span></div>
      <div id="batches" class="cards"></div>
    </div>
    <div class="panel" id="tasks-panel">
      <div class="panel-head"><h2>Posted tasks</h2><span class="hint">Set-DevStatus.ps1 / devdash.py post</span></div>
      <div id="tasks" class="cards"></div>
    </div>
    <div class="panel" id="system-panel">
      <div class="panel-head"><h2>Builds and checks</h2></div>
      <div id="system"></div>
    </div>
  </section>
  <section class="col">
    <div class="panel">
      <div class="panel-head"><h2>Research and agent work</h2><span class="hint">Claude Code workflow runs</span></div>
      <div id="flows" class="cards"></div>
      <div id="flows-done"></div>
    </div>
  </section>
  <section class="col wide">
    <div class="panel">
      <div class="panel-head">
        <h2>History</h2>
        <div class="filters" id="hist-filters">
          <button data-state="" class="pill on">All</button>
          <button data-state="passed" class="pill">Passed</button>
          <button data-state="failed" class="pill">Failed</button>
          <button data-state="refused" class="pill">Refused</button>
          <input id="hist-search" type="search" placeholder="scenario" aria-label="filter by scenario" spellcheck="false">
        </div>
      </div>
      <div class="table-wrap">
        <table class="runs">
          <thead><tr><th>State</th><th>Started</th><th>Scenario</th><th class="num">Steps</th><th class="num">Time</th><th>Checks</th><th class="num">Shots</th></tr></thead>
          <tbody id="hist"></tbody>
        </table>
      </div>
      <div class="more"><button id="hist-more" class="btn">Load more</button></div>
    </div>
  </section>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-bar">
    <button class="btn icon" id="drawer-close" title="Close (Esc)" aria-label="Close">&#x2715;</button>
    <div class="drawer-title" id="drawer-title"></div>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous">&#x2039;</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button class="lb-btn lb-next" id="lb-next" aria-label="Next">&#x203A;</button>
  <button class="lb-btn lb-close" id="lb-close" aria-label="Close">&#x2715;</button>
</div>
</body>
</html>
